<template>
    <div class="body">
        <div class="title-container">
            <h1 class="slds-text-heading_large slds-align_absolute-center">Perguntas Frequentes</h1>
        </div>

        <div class="search-container">
            <lightning-input name="searchString" type="text" class="search-box" onchange={handleSearch}
                placeholder="Pesquisar"></lightning-input>
        </div>

        <template for:each={results} for:item="faq">
            <div key={faq.Id} class="faq-item">
                <h2 class="slds-text-heading_medium question">{faq.Question__c.value}</h2>
                <p class="answer">
                    <lightning-formatted-rich-text value={faq.Answer__c.value}></lightning-formatted-rich-text>
                </p>
            </div>
        </template>

        <div class="slds-grid slds-grid_vertical-align-center slds-var-m-horizontal_x-small">
            <div class="slds-col slds-size_2-of-12">
                <lightning-button-icon disabled={isFirstPage} class="previous" icon-name="utility:chevronleft"
                    onclick={handlePrevious}>
                    <label>Previous</label>
                </lightning-button-icon>
            </div>
            <div class="slds-col slds-size_8-of-12 slds-text-align_center status">
                {totalCount} items • page {currentPageNumber} of
                {totalPages}
            </div>
            <div class="slds-col slds-size_2-of-12 slds-text-align_right">
                <lightning-button-icon disabled={isLastPage} class="next" icon-name="utility:chevronright"
                    onclick={handleNext}>
                    <label>Next</label>
                </lightning-button-icon>
            </div>
        </div>

        <template lwc:if={errors}>
            <p>{errors}</p>
        </template>

    </div>
</template>
