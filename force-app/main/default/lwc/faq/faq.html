<template>
    <div class="faq-body">
        <div>
            <h1 class="slds-text-heading_large slds-align_absolute-center">Perguntas Frequentes</h1>
        </div>
        <div class="search-section">
            <lightning-input type="text" class="search-box" placeholder="Pesquisar"></lightning-input>
        </div>
        <template for:each={faqs} for:item="faq">
            <div key={faq.id} class="faq-item">
                <h5>{faq.question}</h5>
                <p>
                    <lightning-formatted-rich-text value={faq.answer}></lightning-formatted-rich-text>
                </p>
            </div>
        </template>
    </div>
</template>
